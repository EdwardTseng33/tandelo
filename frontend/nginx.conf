# Tandelo 前端：nginx 靜態伺服＋ /api 反向代理到後端。
# App 用 hash 路由（#/s/home），所以不需要 SPA fallback。

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  charset utf-8;
  charset_types text/css application/javascript application/json image/svg+xml;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;

  # 非 root 執行時暫存目錄要可寫
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  gzip on;
  gzip_vary on;
  gzip_min_length 512;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # 後端位置：docker-compose 用服務名 backend；單獨跑時可用環境變數換（entrypoint 會做 envsubst）
  upstream tandelo_backend { server ${BACKEND_HOST}:${BACKEND_PORT}; }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # POC 不供搜尋引擎收錄（頁面本身也有 noindex）
    add_header X-Robots-Tag "noindex, nofollow" always;

    # 注入後端網址：Docker 版一律走同源的 /api（前端 config.js 在 Pages 版才是空字串）
    location = /config.js {
      default_type application/javascript;
      add_header Cache-Control "no-store" always;
      return 200 "window.TANDELO_API_BASE = '/api';\n";
    }

    location /api/ {
      proxy_pass http://tandelo_backend/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }

    location = /healthz {
      default_type text/plain;
      add_header Cache-Control "no-store" always;
      return 200 "ok\n";
    }

    # HTML 不快取（內容常改）；靜態資源快取一天（檔名沒有 hash，所以不敢設更久）
    location ~* \.html$ { add_header Cache-Control "no-cache" always; }
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico|woff2?)$ {
      add_header Cache-Control "public, max-age=86400" always;
      try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
  }
}
