<div class="stage">
  <aside class="panel" aria-label="示範導覽">
    <h1>Tandelo 冒險世界<small>高保真 Demo · 第 3 週 · 四葉小隊 · 示範資料全部虛構，只存在你的裝置</small></h1>
    <p>被同一隻怪打倒過的人，組隊回去打牠。左邊是孩子的手機。每一個畫面都對到一個既有機制：怪＝卡點、收服＝再測通過、副本＝一週的任務卡、燈塔＝章節。</p>
    <div class="scenes" id="panel-scenes">
      <button data-go="home"><i>1</i><span>今天<small> · 三張任務卡、嚮導的信、整備條</small></span></button>
      <button data-go="play"><i>2</i><span>巡邏作答<small> · 怪的台詞、小陪四層引導</small></span></button>
      <button data-go="relay"><i>3</i><span>Boss 接力<small> · 一人一棒、這步怪怪的</small></span></button>
      <button data-go="ambush"><i>4</i><span>伏擊<small> · 沒有提示、只認第一次 → 收服時刻</small></span></button>
      <button data-go="settle"><i>5</i><span>副本結算<small> · 小隊解題率 80%、兩星</small></span></button>
      <button data-go="duel"><i>6</i><span>出題戰<small> · 候選答案投票、六分制</small></span></button>
      <button data-go="shadows"><i>7</i><span>影子牆<small> · 傳說卡、稱號、冒險日誌</small></span></button>
      <button data-go="map"><i>8</i><span>世界地圖<small> · 六座燈塔、點燈與守塔</small></span></button>
      <button data-go="guild"><i>9</i><span>公會與徽章賽<small> · 達標制、全服目標、徽章冊</small></span></button>
      <button data-go="camp"><i>10</i><span>營地來信<small> · 家長的 LINE、我見證了</small></span></button>
      <button data-go="coach"><i>11</i><span>小陪<small> · 問、指、借、示範一步</small></span></button>
      <button data-go="settings"><i>⚙</i><span>示範設定<small> · 時間快轉、關燈、深色、投票</small></span></button>
    </div>
    <p class="fine">伏擊層要把時間快轉到「週一 19:10」才會開；「週二 22:40」看關燈。這份 Demo 對應 <a href="../adventure.html">冒險小隊概念稿</a>、<a href="../coach.html">AI 陪跑設計稿</a> 與 <a href="../strategy.html">策略與規劃 2.0</a>。後端規則在 backend/app/services/world.py。</p>
