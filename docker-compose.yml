# Tandelo POC：frontend（nginx:8080，/api 反向代理）＋ backend（FastAPI:8000，SQLite 存 ./data）
# 可選 Postgres：docker compose --profile postgres up -d，並在 .env 設 DATABASE_URL（見 .env.example）

name: tandelo

services:
  frontend:
    build: ./frontend
    image: tandelo-frontend:local
    ports:
      - "8080:8080"
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "8000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ./backend
    image: tandelo-backend:local
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/tandelo.db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      COACH_PROVIDER: ${COACH_PROVIDER:-rules}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
    volumes:
      - ./data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16.6-alpine
    profiles: [postgres]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tandelo}
      POSTGRES_USER: ${POSTGRES_USER:-tandelo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tandelo} -d ${POSTGRES_DB:-tandelo}"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
